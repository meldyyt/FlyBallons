<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fly Balloons — Сборка мольберта | Астана</title>

  <!-- Google Fonts: Cormorant Garamond (Luxury Serif) + Montserrat / Inter (Clean Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #fbf5ef;
      --bg-blush: #f8dfdc;
      --bg-peach: #fcebe4;
      --text-dark: #3e3230;
      --text-muted: #8c7771;
      --gold-gradient: linear-gradient(135deg, #c96f72 0%, #d49c63 100%);
      --btn-primary: linear-gradient(135deg, #c76f75 0%, #c99b5e 100%);
      --btn-insta: linear-gradient(135deg, #df4d58 0%, #c13584 100%);
      --btn-gis: linear-gradient(135deg, #00b956 0%, #009c48 100%);
      --card-glass: rgba(255, 255, 255, 0.55);
      --card-border: rgba(255, 255, 255, 0.85);
      --shadow-soft: 0 14px 30px rgba(199, 111, 117, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    /* Outer Wrapper for Smartphone Canvas (Fluid on mobile, centered frame on desktop) */
    .mobile-screen {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      position: relative;
      background: radial-gradient(circle at 10% 20%, #fae5df 0%, transparent 45%),
                  radial-gradient(circle at 90% 45%, #fdece3 0%, transparent 50%),
                  radial-gradient(circle at 50% 85%, #fce2dc 0%, #fbf5ef 60%);
      background-color: var(--bg-cream);
      box-shadow: 0 0 60px rgba(180, 130, 120, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Ambient Floating Glow Blobs */
    .glow-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(65px);
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      width: 260px;
      height: 260px;
      background: rgba(243, 196, 190, 0.65);
      top: 15%;
      left: -60px;
    }
    .blob-2 {
      width: 220px;
      height: 220px;
      background: rgba(247, 218, 187, 0.55);
      bottom: 25%;
      right: -50px;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      background: rgba(251, 245, 239, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.6);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    /* Balloon Icon matching reference badge */
    .logo-badge {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid rgba(212, 156, 99, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(201, 111, 114, 0.1);
    }

    .logo-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem;
      font-weight: 500;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.03em;
    }

    /* MAIN CONTENT */
    main {
      position: relative;
      z-index: 10;
      padding: 24px 22px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    /* Balloon Bouquet Hero Illustration */
    .hero-art {
      width: 170px;
      height: 120px;
      margin: 4px 0 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: floatEffect 4.5s ease-in-out infinite;
    }

    @keyframes floatEffect {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    /* TYPOGRAPHY */
    .hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.3rem;
      line-height: 1.15;
      font-weight: 500;
      text-align: center;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .hero-subtitle {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 12px;
    }

    .hero-desc {
      font-size: 0.88rem;
      line-height: 1.45;
      color: #6d5b56;
      text-align: center;
      max-width: 310px;
      margin-bottom: 24px;
      font-weight: 400;
    }

    /* VIDEO PREVIEW CARD */
    .video-card {
      width: 100%;
      aspect-ratio: 16 / 9.5;
      background: #fdfaf7;
      border-radius: 24px;
      border: 1px solid var(--card-border);
      box-shadow: 0 16px 35px rgba(206, 142, 138, 0.22);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-gallery {
      width: 100%;
      display: grid;
      gap: 18px;
      margin-bottom: 28px;
    }

    .video-item {
      display: grid;
      gap: 8px;
    }

    .video-item video {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      object-fit: cover;
      background: #2f2523;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 16px 35px rgba(206, 142, 138, 0.22);
    }

    .video-item-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: #6d514c;
      text-align: center;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .video-poster {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(247, 222, 215, 0.45) 0%, rgba(235, 185, 179, 0.85) 100%),
                  radial-gradient(circle at 50% 40%, #ffffff 0%, #ebd7d1 85%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    /* Easel silhouette mockup */
    .easel-graphic {
      width: 72px;
      height: 72px;
      opacity: 0.85;
      stroke: #8d625e;
      fill: none;
    }

    .play-btn-pulse {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 8px 24px rgba(199, 111, 117, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease;
    }

    .play-btn-pulse::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      animation: pulseRing 2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    }

    @keyframes pulseRing {
      0% { transform: scale(0.9); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .play-icon {
      width: 0;
      height: 0;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-left: 17px solid #c76f75;
      margin-left: 4px;
    }

    .video-tag {
      position: absolute;
      bottom: 14px;
      padding: 5px 13px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 500;
      color: #7a544f;
      letter-spacing: 0.05em;
    }

    /* ACTION BUTTONS (STACKED PILLS) */
    .actions-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .pill-btn {
      width: 100%;
      padding: 16px 20px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: none;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .pill-btn:active {
      transform: scale(0.975);
    }

    .pill-btn.primary {
      background: var(--btn-primary);
      box-shadow: 0 12px 25px rgba(201, 111, 117, 0.35);
    }

    .pill-btn.insta {
      background: var(--btn-insta);
      box-shadow: 0 12px 25px rgba(223, 77, 88, 0.35);
    }

    .pill-btn.gis {
      background: var(--btn-gis);
      box-shadow: 0 12px 25px rgba(0, 185, 86, 0.35);
    }

    .pill-btn svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .instructions {
      width: 100%;
      margin-top: 8px;
    }

    .instructions-title {
      margin-bottom: 12px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.55rem;
      font-weight: 600;
      color: #6f4c47;
      text-align: center;
    }

    .language-switcher {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .language-btn {
      flex: 1;
      padding: 11px 8px;
      border: 1px solid rgba(201, 111, 117, 0.35);
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.55);
      color: #805c56;
      font: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .language-btn.active {
      background: var(--btn-primary);
      border-color: transparent;
      color: #fff;
    }

    .instruction-images {
      display: grid;
      gap: 14px;
    }

    .instruction-images img {
      width: 100%;
      display: block;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 24px rgba(130, 86, 76, 0.16);
    }

    /* FOOTER */
    footer {
      padding: 16px;
      text-align: center;
      font-size: 0.7rem;
      color: #9f8983;
      letter-spacing: 0.05em;
    }

    /* VIDEO MODAL (POPUP) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(43, 30, 28, 0.75);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      width: 100%;
      max-width: 480px;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      border: none;
      color: #fff;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }

    .video-wrapper iframe, .video-wrapper video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

  </style>
</head>
<body>

  <!-- MOBILE SMARTPHONE SCREEN CONTAINER -->
  <div class="mobile-screen">
    <!-- Ambient Blur Spheres -->
    <div class="glow-blob blob-1"></div>
    <div class="glow-blob blob-2"></div>

    <!-- HEADER BAR -->
    <header>
      <a href="#" class="brand-logo">
        <div class="logo-badge">
          <img src="logo.jpg" alt="Логотип FlyBalloons Astana">
        </div>
        <span class="brand-name">Fly Balloons</span>
      </a>
    </header>

    <!-- MAIN VIEW -->
    <main>
      <!-- Central Balloon Illustration Cluster (From Reference Art) -->
      <div class="hero-art">
        <svg viewBox="0 0 160 110" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Balloon 1 (Peach/Gold Left) -->
          <g transform="translate(18, 25)">
            <ellipse cx="18" cy="22" rx="14" ry="17" fill="url(#ballGold)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))"/>
            <ellipse cx="13" cy="17" rx="3.5" ry="6" fill="rgba(255,255,255,0.4)"/>
            <path d="M18 39 Q19 55 16 75" stroke="#d5b2a5" stroke-width="1"/>
          </g>
          <!-- Balloon 2 (Golden Top-Left) -->
          <g transform="translate(42, 10)">
            <ellipse cx="18" cy="22" rx="16" ry="19" fill="url(#ballYellow)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))"/>
            <ellipse cx="13" cy="16" rx="4" ry="7" fill="rgba(255,255,255,0.45)"/>
            <path d="M18 41 Q22 62 20 85" stroke="#d5b2a5" stroke-width="1"/>
          </g>
          <!-- Balloon 3 (Center Vivid Pink) -->
          <g transform="translate(68, 8)">
            <ellipse cx="23" cy="28" rx="23" ry="27" fill="url(#ballPink)" filter="drop-shadow(0 8px 12px rgba(220,90,110,0.22))"/>
            <ellipse cx="16" cy="20" rx="5" ry="9" fill="rgba(255,255,255,0.55)"/>
            <path d="M23 55 Q21 78 24 95" stroke="#d5b2a5" stroke-width="1.2"/>
          </g>
          <!-- Balloon 4 (Soft Lilac Right) -->
          <g transform="translate(104, 12)">
            <ellipse cx="16" cy="20" rx="14" ry="17" fill="url(#ballLilac)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))"/>
            <ellipse cx="12" cy="15" rx="3.5" ry="6" fill="rgba(255,255,255,0.45)"/>
            <path d="M16 37 Q15 60 20 80" stroke="#d5b2a5" stroke-width="1"/>
          </g>
          <!-- Balloon 5 (Baby Pink Far-Right) -->
          <g transform="translate(122, 30)">
            <ellipse cx="13" cy="16" rx="12" ry="14" fill="url(#ballRose)" filter="drop-shadow(0 3px 5px rgba(0,0,0,0.08))"/>
            <path d="M13 30 Q14 55 10 70" stroke="#d5b2a5" stroke-width="1"/>
          </g>

          <!-- Gradient Definitions -->
          <defs>
            <linearGradient id="ballPink" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fa869f"/>
              <stop offset="60%" stop-color="#ea4d6a"/>
              <stop offset="100%" stop-color="#b82d49"/>
            </linearGradient>
            <linearGradient id="ballYellow" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffe386"/>
              <stop offset="80%" stop-color="#d69b32"/>
            </linearGradient>
            <linearGradient id="ballGold" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f5ba8a"/>
              <stop offset="80%" stop-color="#cb7e4e"/>
            </linearGradient>
            <linearGradient id="ballLilac" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#c995f7"/>
              <stop offset="80%" stop-color="#7d59b8"/>
            </linearGradient>
            <linearGradient id="ballRose" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f88390"/>
              <stop offset="80%" stop-color="#cf4457"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <!-- Typography -->
      <h1 class="hero-title">Сборка мольберта</h1>
      <p class="hero-subtitle">ВОЗДУШНЫЕ ШАРЫ · АСТАНА</p>
      <p class="hero-desc">Пошаговое видеоруководство: как легко и быстро собрать мольберт для вашей фотозоны</p>

      <!-- Local instruction videos -->
      <div class="video-gallery">
        <div class="video-item">
          <video controls playsinline preload="metadata">
            <source src="instruction-video-1.MOV" type="video/quicktime">
            Ваш браузер не поддерживает воспроизведение видео.
          </video>
          <span class="video-item-title">Инструкция — видео 1</span>
        </div>
        <div class="video-item">
          <video controls playsinline preload="metadata">
            <source src="instruction-video-2.MOV" type="video/quicktime">
            Ваш браузер не поддерживает воспроизведение видео.
          </video>
          <span class="video-item-title">Инструкция — видео 2</span>
        </div>
      </div>

      <!-- Action Buttons Stack (Exact Reference Pill Styling) -->
      <div class="actions-stack">
        <!-- 1. Website -->
        <a href="https://flyballons.netlify.app/" target="_blank" rel="noopener noreferrer" class="pill-btn primary">
          Наш сайт
        </a>

        <!-- 2. Instagram Direct -->
        <a href="https://www.instagram.com/flyballoons_astana" target="_blank" rel="noopener noreferrer" class="pill-btn insta">
          <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
          Instagram
        </a>

        <!-- 3. 2GIS Navigation -->
        <a href="https://2gis.kz/astana/firm/70000001081279382" target="_blank" rel="noopener noreferrer" class="pill-btn gis">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          2ГИС — Найти нас
        </a>
      </div>

      <!-- Instructions by language -->
      <section class="instructions" aria-labelledby="instructionsTitle">
        <h2 class="instructions-title" id="instructionsTitle">Инструкция по фото</h2>
        <div class="language-switcher" role="group" aria-label="Выбор языка инструкции">
          <button class="language-btn active" type="button" data-language="ru" aria-pressed="true">Русский</button>
          <button class="language-btn" type="button" data-language="kk" aria-pressed="false">Қазақша</button>
        </div>
        <div class="instruction-images" id="instructionImages">
          <img src="instruction-ru-1.jpeg" alt="Русская инструкция, шаги 1–4" data-language-image="ru">
          <img src="instruction-ru-2.jpeg" alt="Русская инструкция, шаги 1–3" data-language-image="ru">
          <img src="instruction-kk-1.jpeg" alt="Қазақша нұсқаулық, 1–3 қадам" data-language-image="kk" hidden>
          <img src="instruction-kk-2.jpeg" alt="Қазақша нұсқаулық, 1–4 қадам" data-language-image="kk" hidden>
        </div>
      </section>

    </main>

    <!-- FOOTER -->
    <footer>
      © 2026 Fly Balloons. Выбирайте нас. Астана
    </footer>
  </div>

  <script>
    const languageButtons = document.querySelectorAll('.language-btn');
    const instructionImages = document.querySelectorAll('[data-language-image]');

    languageButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const language = button.dataset.language;
        languageButtons.forEach((item) => {
          const isActive = item === button;
          item.classList.toggle('active', isActive);
          item.setAttribute('aria-pressed', String(isActive));
        });
        instructionImages.forEach((image) => {
          image.hidden = image.dataset.languageImage !== language;
        });
      });
    });
  </script>
</body>
</html>
